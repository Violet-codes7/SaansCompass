AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Saans Compass: GRAP rules and a personal air-quality plan for Delhi.
  Web Lambda (Flask) behind an HTTP API, and a scheduled Alert Lambda that
  emails area subscribers through SNS when the plan changes.

Parameters:
  BudgetEmail:
    Type: String
    Default: ""
    Description: Optional. Email for a USD 1 monthly cost budget alert. Leave empty to skip the budget.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional. Email to notify when the Alert Lambda errors. Leave empty to skip.
  BedrockModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Claude model on Amazon Bedrock for the plain-language summary. Leave empty to turn the summary off.
  BedrockRegion:
    Type: String
    Default: ap-south-1
    Description: Region to call Bedrock in.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasBedrock: !Not [!Equals [!Ref BedrockModel, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        TABLE: !Ref Table
        TOPIC_ARN: !Ref AlertTopic
        OFFICIAL_STAGE_PARAM: !Ref OfficialStageParam

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Saans Compass pages, JSON API, poster and subscribe form
      Handler: saans.lambda_handler.handler
      # The AI summary can take a few seconds; HTTP APIs allow up to 30.
      Timeout: 29
      Environment:
        Variables:
          BEDROCK_MODEL: !Ref BedrockModel
          BEDROCK_REGION: !Ref BedrockRegion
          # The English/Hindi switch uses Amazon Translate, with a built-in
          # dictionary when Translate is unavailable.
          TRANSLATE: "on"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertTopic
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/official-stage"
        - Statement:
            - Effect: Allow
              Action: translate:TranslateText
              Resource: "*"
        - !If
          - HasBedrock
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - polly:SynthesizeSpeech
                Resource: "*"
          - !Ref AWS::NoValue

  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks every area and emails subscribers when the plan changes
      Handler: saans.alert_handler.handler
      Timeout: 120
      Environment:
        Variables:
          SITE_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
      Events:
        Morning:
          Type: ScheduleV2
          Properties:
            Description: 06:00 IST check for today
            ScheduleExpression: "cron(0 6 * * ? *)"
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"run": "today"}'
        Evening:
          Type: ScheduleV2
          Properties:
            Description: 19:00 IST check for tomorrow
            ScheduleExpression: "cron(0 19 * * ? *)"
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"run": "tomorrow"}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/official-stage"

  OfficialStageParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/official-stage"
      Type: String
      Value: unset
      Description: GRAP stage CAQM has declared for Delhi today (I, II, III, IV, 0) or "unset" to estimate from AQI

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Saans Compass

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WebFunction}"
      RetentionInDays: 14

  AlertLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AlertFunction}"
      RetentionInDays: 14

  OpsTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      DisplayName: Saans Compass ops
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  AlertErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The scheduled alert check failed for at least one area
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlertFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref OpsTopic], !Ref "AWS::NoValue"]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
           "properties": {"title": "Invocations and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
             "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${WebFunction}"],
                         [".", "Errors", ".", "."],
                         [".", "Invocations", ".", "${AlertFunction}"],
                         [".", "Errors", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
           "properties": {"title": "Duration p90 (ms)", "region": "${AWS::Region}", "stat": "p90", "period": 300,
             "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${WebFunction}"],
                         [".", ".", ".", "${AlertFunction}"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
           "properties": {"title": "Forecast fell back to demo data", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
             "metrics": [["SaansCompass", "DemoDataFallback"]]}},
          {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
           "properties": {"title": "API requests and 5xx", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
             "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}"],
                         [".", "5xx", ".", "."]]}}
        ]}

  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 1
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  SiteUrl:
    Description: Public URL of the app
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  AlertFunctionName:
    Description: Invoke by hand for the demo with sam remote invoke AlertFunction
    Value: !Ref AlertFunction
  AlertTopicArn:
    Value: !Ref AlertTopic
  TableName:
    Value: !Ref Table
  OfficialStageParameter:
    Description: Set the declared GRAP stage with aws ssm put-parameter --overwrite --name <this> --value III
    Value: !Ref OfficialStageParam
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}"
