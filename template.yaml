AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Saans Compass: a personal air-quality plan for Delhi-NCR, with the GRAP rules.
  Web Lambda (Flask) behind an HTTP API, and a scheduled Alert Lambda that
  emails area subscribers through SNS when the plan changes.

Parameters:
  BudgetEmail:
    Type: String
    Default: ""
    Description: Optional. Email for a USD 1 monthly cost budget alert. Leave empty to skip the budget.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional. Email to notify when the Alert Lambda errors. Leave empty to skip.
  AiProvider:
    Type: String
    Default: gemini
    AllowedValues: [gemini, bedrock, "off"]
    Description: >
      Model for personal advice and reading the "What do you do?" box. gemini reads its API key
      from the SecureString parameter /<stack name>/gemini-api-key; bedrock uses BedrockModel;
      "off" hides the advice and reads the box with keywords.
  GeminiModel:
    Type: String
    Default: gemini-flash-latest
    Description: Gemini model id when AiProvider is gemini.
  BedrockModel:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    Description: >
      Bedrock model or inference profile id. Claude ids (anthropic.*) use the Anthropic Messages API;
      any other model, such as apac.amazon.nova-lite-v1:0, uses Bedrock's Converse API.
  BedrockRegion:
    Type: String
    Default: ap-south-1
    Description: Region to call Bedrock in.
  Accounts:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
    Description: Sign-up and sign-in with Amazon Cognito, so people can save their profile.
  Grap:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
    Description: Delhi-NCR's GRAP stage and the GRAP rules that apply to each person (Cedar). Off shows the air plan only.
  VoiceChat:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
    Description: Ask Saans by voice in Hindi (the browser's speech recognition) and hear the answer read by Amazon Polly. Needs the AI on.
  AirMap:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
    Description: Pollution map on the home page, on an Amazon Location Service base map (open tiles if its key is missing).
  CleanRoute:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
    Description: Cleaner route on the plan page, comparing routes from Amazon Location Service by the air along each.
  DefaultArea:
    Type: String
    Default: anand-vihar
    Description: Area picked on the form when none is chosen (an id from src/saans/config/areas.json).
  DashboardArea:
    Type: String
    Default: ito
    Description: Area shown in the live dashboard on the home page.
  AlertPersonas:
    Type: String
    Default: school,rider,older
    Description: Comma-separated personas whose plans the email alerts compare.
  MorningAlertHour:
    Type: Number
    Default: 6
    MinValue: 0
    MaxValue: 23
    Description: Hour (India time) of the alert check for today.
  EveningAlertHour:
    Type: Number
    Default: 19
    MinValue: 0
    MaxValue: 23
    Description: Hour (India time) of the alert check for tomorrow.

Conditions:
  HasAccounts: !Equals [!Ref Accounts, "on"]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasAirMap: !Equals [!Ref AirMap, "on"]
  HasCleanRoute: !Equals [!Ref CleanRoute, "on"]
  HasBedrock: !And
    - !Equals [!Ref AiProvider, bedrock]
    - !Not [!Equals [!Ref BedrockModel, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        TABLE: !Ref Table
        GRAP_ENABLED: !Ref Grap
        TOPIC_ARN: !Ref AlertTopic
        OFFICIAL_STAGE_PARAM: !Ref OfficialStageParam
        # Any key in src/saans/config/settings.json can be overridden by an
        # environment variable of the same name in capitals.
        DEFAULT_AREA: !Ref DefaultArea
        DASHBOARD_AREA: !Ref DashboardArea
        ALERT_PERSONAS: !Ref AlertPersonas
        ALERT_MORNING_HOUR: !Ref MorningAlertHour
        ALERT_EVENING_HOUR: !Ref EveningAlertHour

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Saans Compass pages, JSON API, poster and subscribe form
      Handler: saans.lambda_handler.handler
      # The AI summary can take a few seconds; HTTP APIs allow up to 30.
      Timeout: 29
      Environment:
        Variables:
          AI_PROVIDER: !Ref AiProvider
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_KEY_PARAM: !Sub "/${AWS::StackName}/gemini-api-key"
          # CPCB's live station AQI from data.gov.in; the key is a SecureString you create once.
          DATAGOV_KEY_PARAM: !Sub "/${AWS::StackName}/datagov-api-key"
          # The same stations through aqicn.org when data.gov.in is down; optional.
          WAQI_TOKEN_PARAM: !Sub "/${AWS::StackName}/waqi-token"
          BEDROCK_MODEL: !If [HasBedrock, !Ref BedrockModel, ""]
          BEDROCK_REGION: !Ref BedrockRegion
          # The English/Hindi switch uses Amazon Translate, with a built-in
          # dictionary when Translate is unavailable.
          TRANSLATE: "on"
          VOICE_CHAT: !Ref VoiceChat
          # Cognito app client for sign-in; empty turns accounts off.
          USER_POOL_CLIENT_ID: !If [HasAccounts, !Ref UserPoolClient, ""]
          # Pollution map and Cleaner route (Amazon Location Service).
          AIR_MAP: !Ref AirMap
          CLEAN_ROUTE: !Ref CleanRoute
          LOCATION_REGION: !Ref AWS::Region
          MAP_KEY_NAME: !If [HasAirMap, !Sub "${AWS::StackName}-map", ""]
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertTopic
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/official-stage"
        # The Gemini API key, a SecureString you create once (see DEPLOY_WINDOWS.md).
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/gemini-api-key"
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/datagov-api-key"
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/waqi-token"
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
                - polly:SynthesizeSpeech
              Resource: "*"
        - !If
          - HasAirMap
          - Statement:
              - Effect: Allow
                Action: geo:DescribeKey
                Resource: !GetAtt MapKey.Arn
          - !Ref AWS::NoValue
        - !If
          - HasCleanRoute
          - Statement:
              - Effect: Allow
                Action: geo-routes:CalculateRoutes
                Resource: !Sub "arn:${AWS::Partition}:geo-routes:${AWS::Region}::provider/default"
          - !Ref AWS::NoValue
        - !If
          - HasBedrock
          - Statement:
              - Effect: Allow
                Action:
                  # Claude through the Anthropic Messages API on Bedrock
                  - bedrock-mantle:CreateInference
                  # Other Bedrock models through the Converse API
                  - bedrock:InvokeModel
                Resource: "*"
          - !Ref AWS::NoValue

  # The base map for the pollution map and Cleaner route. Browsers use this
  # key to load map tiles only; the web Lambda reads its value with DescribeKey.
  MapKey:
    Type: AWS::Location::APIKey
    Condition: HasAirMap
    Properties:
      KeyName: !Sub "${AWS::StackName}-map"
      Description: Saans Compass base map tiles
      NoExpiry: true
      Restrictions:
        AllowActions:
          - geo-maps:GetTile
          - geo-maps:GetStaticMap
        AllowResources:
          - !Sub "arn:${AWS::Partition}:geo-maps:${AWS::Region}::provider/default"

  # People sign up with their email; Cognito checks the address with a code
  # and keeps the password. The web app calls it with its public app client,
  # so the Lambda needs no extra permissions.
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: HasAccounts
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Saans Compass code
        EmailMessage: "Your Saans Compass code is {####}. Enter it on the site to confirm your email."

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasAccounts
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks every area and emails subscribers when the plan changes
      Handler: saans.alert_handler.handler
      Timeout: 120
      Environment:
        Variables:
          SITE_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
          DATAGOV_KEY_PARAM: !Sub "/${AWS::StackName}/datagov-api-key"
          WAQI_TOKEN_PARAM: !Sub "/${AWS::StackName}/waqi-token"
      Events:
        Morning:
          Type: ScheduleV2
          Properties:
            Description: Morning check for today (India time)
            ScheduleExpression: !Sub "cron(0 ${MorningAlertHour} * * ? *)"
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"run": "today"}'
        Evening:
          Type: ScheduleV2
          Properties:
            Description: Evening check for tomorrow (India time)
            ScheduleExpression: !Sub "cron(0 ${EveningAlertHour} * * ? *)"
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"run": "tomorrow"}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/official-stage"
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/datagov-api-key"
        - SSMParameterReadPolicy:
            ParameterName: !Sub "${AWS::StackName}/waqi-token"

  OfficialStageParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/official-stage"
      Type: String
      Value: unset
      Description: GRAP stage CAQM has declared for Delhi today (I, II, III, IV, 0) or "unset" to estimate from AQI

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Saans Compass

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WebFunction}"
      RetentionInDays: 14

  AlertLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AlertFunction}"
      RetentionInDays: 14

  OpsTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      DisplayName: Saans Compass ops
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  AlertErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The scheduled alert check failed for at least one area
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlertFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref OpsTopic], !Ref "AWS::NoValue"]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
           "properties": {"title": "Invocations and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
             "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${WebFunction}"],
                         [".", "Errors", ".", "."],
                         [".", "Invocations", ".", "${AlertFunction}"],
                         [".", "Errors", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
           "properties": {"title": "Duration p90 (ms)", "region": "${AWS::Region}", "stat": "p90", "period": 300,
             "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${WebFunction}"],
                         [".", ".", ".", "${AlertFunction}"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
           "properties": {"title": "Forecast outages (stale = last real forecast used)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
             "metrics": [["SaansCompass", "StaleForecast"], [".", "ForecastUnavailable"]]}},
          {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
           "properties": {"title": "API requests and 5xx", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
             "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}"],
                         [".", "5xx", ".", "."]]}}
        ]}

  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 1
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  SiteUrl:
    Description: Public URL of the app
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  AlertFunctionName:
    Description: Invoke by hand for the demo with sam remote invoke AlertFunction
    Value: !Ref AlertFunction
  AlertTopicArn:
    Value: !Ref AlertTopic
  TableName:
    Value: !Ref Table
  OfficialStageParameter:
    Description: Set the declared GRAP stage with aws ssm put-parameter --overwrite --name <this> --value III
    Value: !Ref OfficialStageParam
  UserPoolId:
    Condition: HasAccounts
    Description: Cognito user pool holding the sign-ins
    Value: !Ref UserPool
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}"
