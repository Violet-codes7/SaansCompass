{# "Ask Saans": a chat about the plan in the link. Included by plan.html when the AI is on. #}
{% set ct = chat_text %}
<button type="button" class="chat-fab" id="chat-open" aria-controls="chat" aria-expanded="false">💬 <span>{{ ct.open }}</span></button>
<section class="chat" id="chat" role="dialog" aria-modal="false" aria-labelledby="chat-title" hidden
         data-api="{{ url_for('api_chat') }}?{{ request.query_string.decode() }}">
  <header class="chat-head">
    <h2 id="chat-title">💬 {{ ct.title }}</h2>
    <button type="button" class="chat-x" id="chat-close" aria-label="{{ ct.close }}">×</button>
  </header>
  <div class="chat-log" id="chat-log" aria-live="polite">
    <div class="chat-msg bot"><b>{{ ct.bot }}</b><p>{{ ct.intro }}</p></div>
  </div>
  <div class="chat-sugg" id="chat-sugg">
    <span class="small">{{ ct.suggestions_title }}:</span>
    {% for q in ct.suggestions %}<button type="button" class="chip" data-ask="{{ q }}">{{ q }}</button>{% endfor %}
  </div>
  <form class="chat-form" id="chat-form">
    <label class="sr-only" for="chat-q">{{ ct.placeholder }}</label>
    <textarea id="chat-q" rows="1" maxlength="{{ chat_max_chars }}" placeholder="{{ ct.placeholder }}"></textarea>
    {% if voice_chat %}<button type="button" id="chat-mic" class="chat-mic" aria-pressed="false" hidden>🎤 <span>{{ ct.voice.button }}</span></button>{% endif %}
    <button type="submit" id="chat-send">{{ ct.send }}</button>
  </form>
</section>
<script>
(function () {
  var box = document.getElementById("chat"), log = document.getElementById("chat-log");
  var form = document.getElementById("chat-form"), q = document.getElementById("chat-q");
  var openBtn = document.getElementById("chat-open"), send = document.getElementById("chat-send");
  var T = {{ {"you": ct.you, "bot": ct.bot, "thinking": ct.thinking, "network": ct.errors.network, "failed": ct.errors.failed}|tojson }};
  var history = [];
  var V = {{ {"en": ct.voice, "hi": hindi_voice}|tojson }};
  function lang() { return document.documentElement.lang === "hi" ? "hi" : "en"; }
  function add(who, text, cls) {
    var m = document.createElement("div"), b = document.createElement("b");
    m.className = "chat-msg " + who + (cls ? " " + cls : "");
    m.setAttribute("translate", "no");
    b.textContent = who === "user" ? T.you : T.bot;
    m.appendChild(b);
    text.split(/\n+/).forEach(function (line) {
      if (!line.trim()) return;
      var p = document.createElement("p"); p.textContent = line.trim(); m.appendChild(p);
    });
    log.appendChild(m); log.scrollTop = log.scrollHeight;
    return m;
  }
  // Tappable follow-up questions under the latest answer only.
  function next(m, asks) {
    if (!asks || !asks.length) return;
    var row = document.createElement("div");
    row.className = "chat-next"; row.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-top:6px";
    asks.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.dataset.ask = a; b.textContent = a; b.style.cursor = "pointer";
      row.appendChild(b);
    });
    m.appendChild(row); log.scrollTop = log.scrollHeight;
  }
  function open(question) {
    box.hidden = false; openBtn.setAttribute("aria-expanded", "true"); openBtn.hidden = true;
    if (question) { q.value = question; }
    q.focus();
  }
  function close() { box.hidden = true; openBtn.hidden = false; openBtn.setAttribute("aria-expanded", "false"); openBtn.focus(); }
  function ask(question, spoken) {
    question = question.trim();
    if (!question || send.disabled) return;
    log.querySelectorAll(".chat-next").forEach(function (r) { r.remove(); });
    add("user", question);
    document.getElementById("chat-sugg").hidden = true;
    q.value = ""; send.disabled = true;
    var wait = add("bot", T.thinking, "wait");
    fetch(box.dataset.api, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: question, history: history, lang: spoken ? VOICE.answer : lang(), speak: !!spoken})})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        wait.remove();
        if (d.answer) {
          var m = add("bot", d.answer);
          if (d.audio) { play(m, d.audio); }
          next(m, d.follow_ups);
          history.push({role: "user", text: question}, {role: "assistant", text: d.answer});
        } else { add("bot", d.error || T.failed, "err"); }
      })
      .catch(function () { wait.remove(); add("bot", T.network, "err"); })
      .finally(function () { send.disabled = false; q.focus(); });
  }
  // Ask out loud: the browser turns Hindi speech into text, and the answer
  // comes back in Hindi with Amazon Polly's reading of it.
  var VOICE = {listen: {{ voice_listen_lang|tojson }}, answer: {{ voice_answer_lang|tojson }}};
  var mic = document.getElementById("chat-mic");
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  function vt(key) { return (lang() === "hi" && V.hi[key]) || V.en[key]; }
  function play(m, src) {
    var a = document.createElement("audio");
    a.controls = true; a.src = src; a.setAttribute("aria-label", vt("play"));
    a.style.cssText = "display:block;width:100%;margin-top:6px";
    m.appendChild(a);
    var p = a.play(); if (p && p.catch) p.catch(function () {});
  }
  if (mic && Rec) {
    mic.hidden = false;
    var label = mic.querySelector("span"), rec = null;
    function idle() { rec = null; mic.setAttribute("aria-pressed", "false"); label.textContent = vt("button"); }
    mic.addEventListener("click", function () {
      if (rec) { rec.stop(); return; }
      if (send.disabled) return;
      open();
      rec = new Rec();
      rec.lang = VOICE.listen; rec.interimResults = true; rec.maxAlternatives = 1;
      var heard = "", failed = false;
      mic.setAttribute("aria-pressed", "true"); label.textContent = vt("stop");
      q.value = ""; q.placeholder = vt("listening");
      rec.onresult = function (e) {
        heard = Array.prototype.map.call(e.results, function (r) { return r[0].transcript; }).join(" ");
        q.value = heard;
      };
      rec.onerror = function (e) {
        failed = true;
        add("bot", e.error === "not-allowed" || e.error === "service-not-allowed" ? vt("blocked") : vt("heard_nothing"), "err");
      };
      rec.onend = function () {
        q.placeholder = {{ ct.placeholder|tojson }};
        idle();
        if (heard.trim()) ask(heard, true);
        else if (!failed) add("bot", vt("heard_nothing"), "err");
      };
      try { rec.start(); } catch (err) { idle(); }
    });
  }
  openBtn.addEventListener("click", function () { open(); });
  document.getElementById("chat-close").addEventListener("click", close);
  box.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  form.addEventListener("submit", function (e) { e.preventDefault(); ask(q.value); });
  q.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
  [document.getElementById("chat-sugg"), log].forEach(function (el) {
    el.addEventListener("click", function (e) { var b = e.target.closest("[data-ask]"); if (b) ask(b.dataset.ask); });
  });
  // "Ask about …" buttons elsewhere on the page open the chat, with a question if they carry one.
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-chat]"); if (!b) return;
    open(); if (b.dataset.chat) ask(b.dataset.chat);
  });
})();
</script>
