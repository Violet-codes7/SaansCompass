<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Saans Compass{% endblock %}</title>
  <meta name="description" content="{{ brand.description }}">
  <meta property="og:title" content="{{ brand.og_title }}">
  <meta property="og:description" content="{{ brand.og_description }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script>try { if (/[?&]lang=hi\b/.test(location.search) || localStorage.getItem("saans-lang") === "hi") document.documentElement.lang = "hi"; } catch (e) {}
  try { if (localStorage.getItem("saans-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="topbar"><header class="site">
    <a class="brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="28" height="28">Saans Compass</a>
    {% if accounts_on %}<nav class="account" aria-label="Account">
      {% if user %}<a href="{{ url_for('account_profile') }}">My profile</a>
      <form method="post" action="{{ url_for('account_signout') }}"><button type="submit" class="linkish">Sign out</button></form>
      {% else %}<a href="{{ url_for('account') }}">Sign in</a> <a href="{{ url_for('account', mode='signup') }}">Create account</a>{% endif %}
    </nav>{% endif %}
    <button type="button" class="theme-toggle" id="theme-toggle" translate="no" aria-pressed="false" data-dark="{{ layout.theme.dark }}" data-light="{{ layout.theme.light }}">{{ layout.theme.dark }}</button>
    <div class="langs" role="group" aria-label="Language" translate="no">
      <button type="button" data-setlang="en" aria-pressed="true">English</button>
      <button type="button" data-setlang="hi" aria-pressed="false">हिंदी</button>
    </div>
    <span class="lang-status small" id="lang-status" aria-live="polite" translate="no"></span>
  </header></div>
  <div class="skyline"><img class="sky-light" src="{{ url_for('static', filename='skyline.svg') }}" alt="{{ layout.banner_label }}" width="960" height="72"><img class="sky-dark" src="{{ url_for('static', filename='skyline-dark.svg') }}" alt="" width="960" height="72" loading="lazy"></div>
  <main>{% block main %}{% endblock %}</main>
  <footer class="site">
    {{ layout.footer }} {% for l in source_links %}<a href="{{ l.url }}" rel="noopener">{{ l.label }}</a>{% if not loop.last %} · {% endif %}{% endfor %}
  </footer>
  <script>
  (function () {
    var b = document.getElementById("theme-toggle"), root = document.documentElement;
    function show() { var dark = root.dataset.theme === "dark"; b.textContent = dark ? b.dataset.light : b.dataset.dark; b.setAttribute("aria-pressed", dark); }
    b.addEventListener("click", function () {
      if (root.dataset.theme === "dark") delete root.dataset.theme; else root.dataset.theme = "dark";
      try { localStorage.setItem("saans-theme", root.dataset.theme || "light"); } catch (e) {}
      show();
    });
    show();
  })();
  // Big AQI figures count up once when the page opens.
  (function () {
    if (!window.matchMedia || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.querySelectorAll(".g-aqi .g-v, .dd-aqi b").forEach(function (el) {
      var end = parseInt(el.textContent, 10);
      if (!/^\s*\d+\s*$/.test(el.textContent) || !(end > 0)) return;
      var t0 = null;
      function step(t) {
        t0 = t0 || t; var k = Math.min(1, (t - t0) / 700);
        el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  })();
  </script>
  <script src="{{ url_for('static', filename='i18n.js') }}" data-api="{{ url_for('api_translate') }}"></script>
</body>
</html>
